name: Build Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # or whatever version is strictly needed
        cache: 'pip'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable
      run: |
        python build_exe.py

    - name: Zip build folder (Windows/Linux)
      if: runner.os != 'macOS'
      run: |
        cd dist
        python -c "import shutil; shutil.make_archive('ProjectAnvaya-${{ runner.os }}', 'zip', 'ProjectAnvaya')"

    - name: Zip build folder (macOS)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r ProjectAnvaya-macOS.zip ProjectAnvaya.app || zip -r ProjectAnvaya-macOS.zip ProjectAnvaya

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProjectAnvaya-${{ runner.os }}
        path: dist/ProjectAnvaya-${{ runner.os }}.zip
